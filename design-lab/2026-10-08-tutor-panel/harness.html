<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor panel harness</title>
<link rel="stylesheet" href="../../panel/media/codicon.css">
<link rel="stylesheet" href="../../panel/media/panel.css">
<style>
  /* VS Code "Dark Modern" tokens, the subset the panel reads. */
  html {
    --vscode-font-family: "Segoe WPC", "Segoe UI", sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: Consolas, "Courier New", monospace;
    --vscode-editor-font-size: 13px;
    --vscode-foreground: #cccccc;
    --vscode-editor-foreground: #cccccc;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-focusBorder: #0078d4;
    --vscode-textLink-foreground: #4daafc;
    --vscode-widget-border: #313131;
    --vscode-sideBar-background: #181818;
    --vscode-sideBarSectionHeader-border: #2b2b2b;
    --vscode-editorWidget-background: #202020;
    --vscode-input-background: #313131;
    --vscode-input-border: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-input-placeholderForeground: #989898;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-inactiveSelectionBackground: #37373d;
    --vscode-button-background: #0078d4;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #026ec1;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-dropdown-background: #313131;
    --vscode-dropdown-border: #3c3c3c;
    --vscode-dropdown-foreground: #cccccc;
    --vscode-gitDecoration-deletedResourceForeground: #f85149;
    --vscode-gitDecoration-addedResourceForeground: #81b88b;
    --vscode-widget-shadow: rgba(0, 0, 0, 0.36);
    --vscode-textCodeBlock-background: #2b2b2b;
    --vscode-editor-selectionBackground: #264f78;
  }
  /* VS Code "Light Modern". */
  html.light {
    --vscode-foreground: #3b3b3b;
    --vscode-editor-foreground: #3b3b3b;
    --vscode-descriptionForeground: #616161;
    --vscode-focusBorder: #005fb8;
    --vscode-textLink-foreground: #005fb8;
    --vscode-widget-border: #e5e5e5;
    --vscode-sideBar-background: #f8f8f8;
    --vscode-sideBarSectionHeader-border: #e5e5e5;
    --vscode-editorWidget-background: #f8f8f8;
    --vscode-input-background: #ffffff;
    --vscode-input-border: #cecece;
    --vscode-input-foreground: #3b3b3b;
    --vscode-input-placeholderForeground: #767676;
    --vscode-list-hoverBackground: #f2f2f2;
    --vscode-list-inactiveSelectionBackground: #e4e6f1;
    --vscode-button-background: #005fb8;
    --vscode-button-hoverBackground: #0258a8;
    --vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31);
    --vscode-dropdown-background: #ffffff;
    --vscode-dropdown-border: #cecece;
    --vscode-dropdown-foreground: #3b3b3b;
    --vscode-gitDecoration-deletedResourceForeground: #ad0707;
    --vscode-gitDecoration-addedResourceForeground: #587c0c;
    --vscode-widget-shadow: rgba(0, 0, 0, 0.16);
    --vscode-textCodeBlock-background: #f2f2f2;
    --vscode-editor-selectionBackground: #add6ff;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // ?fixture=langs loads fixture-langs.js instead of fixture.js.
  const name = new URLSearchParams(location.search).get('fixture')
  document.write(`<script src="${name ? `fixture-${name.replace(/[^a-z0-9-]/gi, '')}.js` : 'fixture.js'}"><\/script>`)
</script>
<script src="lemma.js"></script>
<script>
  // Stands in for the extension host: answers "ready" with the fixture, and
  // plays the host voice route by sending word positions on a timer.
  if (location.hash.includes('light')) document.documentElement.classList.add('light')
  const fixture = window.FIXTURE
  // ?mode=document shows the first plan (or exchange) as a document tab; ?learning=elsewhere
  // shows a window whose project does not learn.
  const params = new URLSearchParams(location.search)
  if (params.get('mode') === 'document') document.body.dataset.mode = 'document'
  if (params.get('learning') === 'elsewhere') fixture.learning = { where: 'elsewhere', project: 'E:/Work/Wind to ride' }
  const send = data => window.postMessage(data, '*')
  let timers = []
  window.HARNESS = { posted: [], freezeAtWord: Number(new URLSearchParams(location.search).get('freeze') ?? -1) }
  window.acquireVsCodeApi = () => ({
    getState: () => undefined,
    setState: () => undefined,
    postMessage(message) {
      window.HARNESS.posted.push(message)
      const totals = fixture.totals ?? {
        today: { tokens: 4300, calls: 9 },
        week: { tokens: 51200, calls: 112 },
        month: { tokens: 160400, calls: 371 },
        projects: [
          { name: 'CC-translator', path: 'E:/Work/CC-translator', tokens: 120300, calls: 280 },
          { name: 'Wind to ride', path: 'E:/Work/Wind to ride', tokens: 40100, calls: 91 },
        ],
      }
      const learning = () => (fixture.settings.enabled ? fixture.learning ?? { where: 'here' } : { where: 'nowhere' })
      const session = () => send({ type: 'session', exchanges: fixture.exchanges, settings: fixture.settings, usage: fixture.usage, totals, learning: learning(), project: 'E:/Work/CC-translator', empty: undefined, config: { voice: '', rate: 1, wordHint: 'shift' } })
      if (message.type === 'setLearning') {
        fixture.settings = { ...fixture.settings, enabled: message.on }
        if (message.on) fixture.learning = { where: 'here' }
        session()
      }
      if (message.type === 'translate') {
        const block = fixture.exchanges.flatMap(x => x.blocks).find(b => b.id === message.ref)
        if (block) {
          block.state = 'translating'
          session()
          setTimeout(() => { block.state = 'done'; block.html = fixture.translatedA2; session() }, 1500)
        }
      }
      if (message.type === 'clear') { fixture.exchanges = []; session() }
      if (message.type === 'lookup') {
        window.__dict = window.__dict || fetch('../../panel/media/dict/en-ru.json').then(r => r.json())
        window.__dict.then(dict => {
          const gloss = Lemma.lookup(dict, message.word)
          send(gloss ? { type: 'gloss', word: message.word, gloss } : { type: 'gloss', word: message.word, missing: 'not-found' })
        })
      }
      if (message.type === 'ready') {
        if (document.body.dataset.mode === 'document') {
          const exchange = fixture.exchanges.find(x => x.kind === 'plan') ?? fixture.exchanges[0]
          send({ type: 'document', exchange, settings: fixture.settings, config: { voice: '', rate: 1, wordHint: 'shift' } })
        } else session()
        send({ type: 'hostVoices', canSpeak: true, platform: 'win32', voices: [
          { name: 'Microsoft David Desktop', lang: 'en-US' },
          { name: 'Microsoft Zira Desktop', lang: 'en-US' },
          { name: 'Microsoft Mark', lang: 'en-US' },
        ] })
      }
      if (message.type === 'setSettings') {
        fixture.settings = { ...fixture.settings, ...message.patch }
        session()
      }
      if (message.type === 'stop') { timers.forEach(clearTimeout); timers = [] }
      if (message.type === 'speak') {
        timers.forEach(clearTimeout); timers = []
        const text = message.items.join(message.separator)
        const words = [...text.matchAll(/[\p{L}\p{N}'’-]+/gu)]
        const limit = window.HARNESS.freezeAtWord >= 0 ? Math.min(words.length, window.HARNESS.freezeAtWord + 1) : words.length
        words.slice(0, limit).forEach((w, i) => timers.push(setTimeout(() => send({ type: 'progress', id: message.id, pos: w.index, len: w[0].length }), 120 + i * 220)))
        if (window.HARNESS.freezeAtWord < 0) timers.push(setTimeout(() => send({ type: 'speakDone', id: message.id }), 200 + words.length * 220))
      }
    },
  })
  // Headless Chromium has no voices; make sure the panel takes the host route.
  if ('speechSynthesis' in window) Object.defineProperty(window.speechSynthesis, 'getVoices', { value: () => [] })
</script>
<script src="../../panel/media/panel.js"></script>
</body>
</html>
